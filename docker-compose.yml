services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_pass
      POSTGRES_DB: trading_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://trading_user:trading_pass@db:5432/trading_db
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "-c", "alembic upgrade head && pytest -v"]

volumes:
  postgres_data:
