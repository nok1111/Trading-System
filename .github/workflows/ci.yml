name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  trading-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          TRADING_MODE: paper
          LIVE_TRADING_ENABLED: "false"
        run: pytest -v

  ai-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest httpx

      - name: Run tests
        run: pytest -v

  auth-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest httpx

      - name: Smoke import check
        run: python -c "import app.main; print('auth-server imports OK')"
